<!DOCTYPE html>
<html lang="en-AU">
  <head>
    <meta charset="utf-8" />
    <title>%WEB_TITLE%</title>

    <!--
      viewport-fit=cover is what lets safe-area-inset-* report real values on
      notched iPhones; without it the UI sits under the notch in standalone mode.
      Zoom is disabled because the map owns pinch-to-zoom — double-tap zooming
      the whole page is the single biggest "this is a website" tell.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />

    <!-- Add to Home Screen: launches fullscreen with no Safari chrome. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ParkFree" />

    <meta name="theme-color" content="#F2EFE7" />
    <meta
      name="description"
      content="Find free street parking in Sydney, live. Streets are colour-coded from real parking-sign data and turn green the minute they're free."
    />

    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!--
      iOS shows a white screen while a home-screen web app boots unless a
      launch image matches the device *exactly* — CSS size and pixel ratio
      both. These are paper-coloured with the wordmark, so the launch image,
      the boot screen in App.tsx and the app itself are one continuous colour
      instead of a white flash. Regenerate with scripts/make-app-icons.py.
    -->
    <!-- iPhone 16 Pro Max -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/launch/launch-1320x2868.png"
    />
    <!-- iPhone 16 Pro -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/launch/launch-1206x2622.png"
    />
    <!-- iPhone 15 Pro Max / 15 Plus / 14 Pro Max -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/launch/launch-1290x2796.png"
    />
    <!-- iPhone 15 / 15 Pro / 14 Pro -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/launch/launch-1179x2556.png"
    />
    <!-- iPhone 14 / 13 / 12 -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/launch/launch-1170x2532.png"
    />
    <!-- iPhone 13 mini / X / XS / 11 Pro -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/launch/launch-1125x2436.png"
    />
    <!-- iPhone XS Max / 11 Pro Max -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
      href="/launch/launch-1242x2688.png"
    />
    <!-- iPhone XR / 11 -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/launch/launch-828x1792.png"
    />
    <!-- iPhone SE / 8 -->
    <link
      rel="apple-touch-startup-image"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
      href="/launch/launch-750x1334.png"
    />

    <style>
      /* Paper ground everywhere so there's no flash of the wrong colour on a
         cold start, and so the area behind the home indicator matches the app. */
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #f2efe7;
      }

      /*
        react-native-web's root view is `flex: 1` with no intrinsic height, so
        it collapses to 0 unless #root is a flex container — the map and the
        bottom controls silently disappear. This rule is part of Expo's default
        web template; keep it whenever this file is customised.
      */
      #root {
        display: flex;
      }

      body {
        /*
          Lock the page so the map pans but the document never scrolls. Height
          is pinned to the *layout* viewport rather than the visual one: when
          iOS Safari raises the keyboard it shrinks the visual viewport, and
          anything sized to that would drag the map upward. The chrome lifts
          itself instead — see src/lib/useKeyboardInset.ts.
        */
        position: fixed;
        top: 0;
        left: 0;
        overflow: hidden;
        width: 100%;
        height: 100%;
        overscroll-behavior: none;

        /* Kill the remaining browser tells: long-press menus, text selection,
           and the grey flash iOS paints over tapped elements. */
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;

        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      /* Inputs are the one place selection must keep working. */
      input,
      textarea {
        -webkit-user-select: text;
        user-select: text;
      }
    </style>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
