<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParkFree Sydney — status</title>
<meta name="description" content="Live coverage and data health for ParkFree Sydney.">
<style>
  :root {
    --bg:#0F1115; --surface:#1A1D24; --line:#2E3340;
    --text:#F4F6FA; --dim:#9AA3B2; --accent:#34D399; --warn:#FBBF24; --bad:#F87171;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:var(--font);
         padding:24px 16px 60px; line-height:1.5; }
  .wrap { max-width:860px; margin:0 auto; }
  h1 { font-size:24px; font-weight:800; letter-spacing:-.5px; margin:0; }
  h1 span { color:var(--accent); }
  .sub { color:var(--dim); font-size:13px; margin-top:4px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:1.4px; color:var(--dim);
       margin:32px 0 12px; font-weight:700; }
  .card { background:var(--surface); border-radius:16px; padding:18px; }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); }
  .big { font-size:30px; font-weight:800; letter-spacing:-1px; }
  .label { color:var(--dim); font-size:12.5px; margin-top:2px; }
  .row { display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:0; }
  .name { flex:1; font-size:14.5px; }
  .bar { flex:0 0 130px; height:7px; background:#242832; border-radius:4px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--accent); }
  .pct { flex:0 0 46px; text-align:right; font-variant-numeric:tabular-nums;
         font-size:13.5px; font-weight:700; color:var(--dim); }
  .pill { display:inline-block; border-radius:999px; padding:4px 11px; font-size:12.5px; font-weight:700; }
  .ok { background:rgba(52,211,153,.16); color:var(--accent); }
  .warn { background:rgba(251,191,36,.16); color:var(--warn); }
  .bad { background:rgba(248,113,113,.16); color:var(--bad); }
  ul { margin:8px 0 0; padding-left:18px; color:var(--dim); font-size:13.5px; }
  li { margin-bottom:5px; }
  .date { color:var(--dim); font-variant-numeric:tabular-nums; font-size:12.5px; flex:0 0 82px; }
  a { color:var(--accent); }
  footer { color:var(--dim); font-size:12px; margin-top:36px; text-align:center; }
  .err { color:var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Park<span>Free</span> Sydney — status</h1>
  <div class="sub" id="generated">Loading…</div>
  <div id="content"></div>
  <footer>
    Built from the repo and the live feed every hour by GitHub Actions —
    nothing here is typed by hand.<br>
    <a href="/">Open the map</a> ·
    <a href="https://github.com/parkinson-cyber/parkfree-sydney">Source</a>
  </footer>
</div>
<script>
const RAW = 'https://raw.githubusercontent.com/parkinson-cyber/parkfree-sydney/data-live/status.json';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ago = (iso) => {
  const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return m + ' min ago';
  const h = Math.floor(m / 60);
  return h < 24 ? h + 'h ago' : Math.floor(h / 24) + 'd ago';
};

fetch(RAW + '?t=' + Math.floor(Date.now() / 300000))
  .then((r) => { if (!r.ok) throw new Error('status ' + r.status); return r.json(); })
  .then(render)
  .catch((e) => {
    document.getElementById('generated').innerHTML =
      '<span class="err">Could not load status (' + esc(e.message) + ').</span> ' +
      'It is published hourly by the Live car parks workflow.';
  });

function render(d) {
  document.getElementById('generated').textContent =
    'Updated ' + ago(d.generated) + ' · build ' + (d.commit || '?');

  const feed = d.liveFeed || {};
  const feedPill = feed.healthy
    ? '<span class="pill ok">healthy</span>'
    : '<span class="pill bad">stale</span>';
  const sharedPill = d.crowdReports && d.crowdReports.sharedStorage
    ? '<span class="pill ok">shared</span>'
    : '<span class="pill warn">this device only</span>';

  const place = (p) =>
    '<div class="row"><div class="name">' + esc(p.name) + '</div>' +
    '<div class="bar"><i style="width:' + p.pct + '%"></i></div>' +
    '<div class="pct">' + p.pct + '%</div></div>';

  document.getElementById('content').innerHTML = `
    <h2>Coverage</h2>
    <div class="grid">
      <div class="card"><div class="big">${d.coverage.pct}%</div>
        <div class="label">${d.coverage.classified.toLocaleString()} of ${d.coverage.total.toLocaleString()} streets have known rules</div></div>
      <div class="card"><div class="big">${d.coverage.sources}</div>
        <div class="label">data sources applied</div></div>
      <div class="card"><div class="big">${d.councilCarParks.withFreePeriod}</div>
        <div class="label">council car parks with a free period, of ${d.councilCarParks.total}</div></div>
    </div>

    <h2>Where it is good</h2>
    <div class="card">${d.places.map(place).join('')}</div>

    <h2>Live data</h2>
    <div class="grid">
      <div class="card">
        <div>${feedPill}</div>
        <div class="label" style="margin-top:8px">
          Car park occupancy · ${feed.facilities || 0} facilities ·
          ${feed.updated ? 'updated ' + ago(feed.updated) : 'unavailable'}
        </div>
        ${(feed.fullest || []).length ? '<ul>' + feed.fullest.map((f) =>
          '<li>' + esc(f.name) + ' — ' + f.pct + '% full</li>').join('') + '</ul>' : ''}
      </div>
      <div class="card">
        <div>${sharedPill}</div>
        <div class="label" style="margin-top:8px">Crowd reports storage</div>
      </div>
      <div class="card">
        <div class="big">${(d.calibration.historyRows || 0).toLocaleString()}</div>
        <div class="label">occupancy readings banked for calibrating the busy estimate</div>
      </div>
    </div>

    <h2>Free parking worth knowing</h2>
    <div class="card">${d.councilCarParks.freeExamples.map((c) =>
      '<div class="row"><div class="name">' + esc(c.name) + '</div>' +
      '<div class="pct" style="flex-basis:60px;color:var(--accent)">' + esc(c.free) + ' free</div></div>').join('')}</div>

    <h2>Recent work</h2>
    <div class="card">${d.recentWork.map((c) =>
      '<div class="row"><div class="date">' + esc(c.date) + '</div>' +
      '<div class="name">' + esc(c.subject) + '</div></div>').join('')}</div>
  `;
}
</script>
</body>
</html>
