# Hourly live car-park occupancy → the `data-live` branch.
#
# The app fetches raw.githubusercontent.com/<repo>/data-live/carparks.json.
# The branch is force-pushed as a single orphan commit every run, so history
# never grows and `main` is never touched. A failed fetch fails the job and
# pushes nothing — the app then keeps showing the last good snapshot until it
# goes stale (3 h) and hides the pins.
#
# Needs the repo secret TFNSW_API_KEY (Open Data Hub, Car Park API).

name: Live car parks

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: carparks-live
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch occupancy
        env:
          TFNSW_API_KEY: ${{ secrets.TFNSW_API_KEY }}
        run: node scripts/fetch-carparks.mjs out/carparks.json
      - name: Publish to data-live (single orphan commit)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd out
          # Vercel builds every branch it sees. This one carries data, not an
          # app, so a build here can only fail - and a red deployment every hour
          # buries real failures. Vercel reads vercel.json from the commit being
          # pushed, so shipping this file in the branch turns its deployments
          # off at the source.
          printf '%s\n' '{ "$schema": "https://openapi.vercel.sh/vercel.json", "git": { "deploymentEnabled": { "data-live": false } } }' > vercel.json

          # Keep every snapshot, not just the latest. Real measured occupancy,
          # hour by hour, is the only ground truth this project has for how
          # parking demand actually moves - it's what the availability estimate
          # gets calibrated against. The branch is force-pushed as one commit,
          # so carry the existing log forward before appending to it.
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data-live/history.jsonl"
          curl -sSf --max-time 60 "$RAW" -o history.jsonl || : > history.jsonl
          python3 - <<'PY' >> history.jsonl
          import json
          feed = json.load(open('carparks.json'))
          for f in feed['facilities']:
              print(json.dumps({
                  't': feed['updated'], 'id': f['id'], 'spots': f['spots'],
                  'occupied': f['occupied'], 'at': f['at'],
              }, separators=(',', ':')))
          PY
          # ~14 months at 40 facilities/hour; trim so the branch stays small.
          tail -n 400000 history.jsonl > history.trimmed && mv history.trimmed history.jsonl
          echo "history.jsonl now $(wc -l < history.jsonl) rows"
          git init -q -b data-live
          git config user.name "parkfree-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add carparks.json vercel.json history.jsonl
          git commit -q -m "carparks $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-live
