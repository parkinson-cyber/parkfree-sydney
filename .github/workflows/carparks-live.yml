# Hourly live car-park occupancy → the `data-live` branch.
#
# The app fetches raw.githubusercontent.com/<repo>/data-live/carparks.json.
# The branch is force-pushed as a single orphan commit every run, so history
# never grows and `main` is never touched. A failed fetch fails the job and
# pushes nothing — the app then keeps showing the last good snapshot until it
# goes stale (3 h) and hides the pins.
#
# Needs the repo secret TFNSW_API_KEY (Open Data Hub, Car Park API).
#
# WHY THIS FIRES THREE TIMES AN HOUR FOR AN HOURLY JOB: GitHub's scheduler is
# best-effort and drops runs under load — a plain `0 * * * *` here actually
# delivered 07:21, 10:28, 14:44, 18:00, 21:20 UTC on 2026-09-10, gaps of over
# three hours, which is exactly the age at which the app hides the pins. So we
# ask three times an hour on unpopular minutes (the top of the hour is the most
# contended slot on the platform) and the `freshness` job below does nothing
# unless the published feed is genuinely ~an hour old. Two of the three runs
# cost about fifteen seconds each and push nothing.

name: Live car parks

on:
  schedule:
    - cron: "7,27,47 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Refresh even if the published feed is still fresh"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: carparks-live
  cancel-in-progress: false

jobs:
  # Is the feed actually due? Cheap enough to run three times an hour.
  freshness:
    runs-on: ubuntu-latest
    outputs:
      due: ${{ steps.check.outputs.due }}
    steps:
      - id: check
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          set -uo pipefail
          if [ "${FORCE:-false}" = "true" ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"; echo "forced"; exit 0
          fi
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data-live/carparks.json"
          AGE=$(curl -sSf --max-time 30 "$RAW" |
            python3 -c 'import sys,json,datetime as d;u=json.load(sys.stdin)["updated"];print(int((d.datetime.now(d.timezone.utc)-d.datetime.fromisoformat(u.replace("Z","+00:00"))).total_seconds()))' \
            2>/dev/null || echo 99999)
          echo "published feed is ${AGE}s old"
          # 50 min, not 60: a run that lands at :47 should still refresh a feed
          # written at :07, or the effective period drifts out to 80 minutes.
          if [ "$AGE" -ge 3000 ]; then echo "due=true" >> "$GITHUB_OUTPUT"; else echo "due=false" >> "$GITHUB_OUTPUT"; fi

  refresh:
    needs: freshness
    if: needs.freshness.outputs.due == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch occupancy
        env:
          TFNSW_API_KEY: ${{ secrets.TFNSW_API_KEY }}
        run: node scripts/fetch-carparks.mjs out/carparks.json
      - name: Build status.json
        run: node scripts/build-status.mjs out/status.json

      - name: Publish to data-live (single orphan commit)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd out
          # Vercel builds every branch it sees. This one carries data, not an
          # app, so a build here can only fail - and a red deployment every hour
          # buries real failures. Vercel reads vercel.json from the commit being
          # pushed, so shipping this file in the branch turns its deployments
          # off at the source.
          printf '%s\n' '{ "$schema": "https://openapi.vercel.sh/vercel.json", "git": { "deploymentEnabled": { "data-live": false } } }' > vercel.json

          # Keep every snapshot, not just the latest. Real measured occupancy,
          # hour by hour, is the only ground truth this project has for how
          # parking demand actually moves - it's what the availability estimate
          # gets calibrated against. The branch is force-pushed as one commit,
          # so carry the existing log forward before appending to it.
          RAW="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data-live/history.jsonl"
          curl -sSf --max-time 60 "$RAW" -o history.jsonl || : > history.jsonl
          python3 - <<'PY' >> history.jsonl
          import json
          feed = json.load(open('carparks.json'))
          for f in feed['facilities']:
              print(json.dumps({
                  't': feed['updated'], 'id': f['id'], 'spots': f['spots'],
                  'occupied': f['occupied'], 'at': f['at'],
              }, separators=(',', ':')))
          PY
          # ~14 months at 40 facilities/hour; trim so the branch stays small.
          tail -n 400000 history.jsonl > history.trimmed && mv history.trimmed history.jsonl
          echo "history.jsonl now $(wc -l < history.jsonl) rows"
          git init -q -b data-live
          git config user.name "parkfree-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add carparks.json vercel.json history.jsonl status.json
          git commit -q -m "carparks $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data-live
